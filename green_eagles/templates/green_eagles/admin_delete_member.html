{% extends 'green_eagles/base.html' %}
{% block content %}
<div class="delete-wrap">
    <div class="delete-card">
        <div class="delete-icon">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <h3 class="delete-title">Remove Member</h3>

        <p class="delete-message">
            Are you sure you want to delete <strong>{{ member.username }}</strong>? This will permanently erase their account and profile data.
        </p>

        <div class="delete-warning">
            <i class="bi bi-shield-exclamation"></i>
            <span>This action cannot be undone.</span>
        </div>

        <form method="post" class="delete-actions">
            {% csrf_token %}
            <a href="{% url 'green_eagles:admin_manage_members' %}" class="delete-cancel">Cancel</a>
            <button type="submit" class="delete-confirm">
                <i class="bi bi-trash3"></i> Confirm Delete
            </button>
        </form>
    </div>
</div>

<style>
.delete-wrap{
    min-height:calc(100vh - 200px);
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4f8f5;
    padding:2.5rem 1rem;
}

.delete-card{
    background:#fff;
    border-radius:18px;
    max-width:440px;
    width:100%;
    padding:2.6rem 2.2rem;
    text-align:center;
    box-shadow:0 20px 50px rgba(192,57,43,0.14);
    border-top:5px solid #c0392b;
    animation:riseIn .45s ease both;
}
@keyframes riseIn{
    from{ opacity:0; transform:translateY(20px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

.delete-icon{
    width:66px; height:66px;
    margin:0 auto 1.3rem;
    border-radius:50%;
    background:rgba(192,57,43,0.1);
    color:#c0392b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.7rem;
    animation:warnPulse 2s ease-in-out infinite;
}
@keyframes warnPulse{
    0%, 100%{ box-shadow:0 0 0 0 rgba(192,57,43,0.25); }
    50%{ box-shadow:0 0 0 12px rgba(192,57,43,0); }
}

.delete-title{
    font-weight:800;
    color:#c0392b;
    font-size:1.4rem;
    margin-bottom:0.9rem;
}

.delete-message{
    color:#5c6b63;
    font-size:0.94rem;
    line-height:1.6;
    margin-bottom:1.2rem;
}
.delete-message strong{
    color:#14532d;
}

.delete-warning{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#fdecea;
    color:#c0392b;
    font-weight:700;
    font-size:0.82rem;
    padding:0.65rem 1rem;
    border-radius:9px;
    margin-bottom:1.8rem;
}

.delete-actions{
    display:flex;
    justify-content:center;
    gap:0.8rem;
}
.delete-cancel{
    padding:0.7rem 1.5rem;
    border-radius:9px;
    border:1.5px solid #d8e3da;
    color:#5c6b63;
    font-weight:700;
    font-size:0.9rem;
    text-decoration:none;
    transition:background .2s ease;
}
.delete-cancel:hover{
    background:#f4f8f5;
    color:#14532d;
}
.delete-confirm{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#c0392b;
    color:#fff;
    border:none;
    padding:0.7rem 1.6rem;
    border-radius:9px;
    font-weight:800;
    font-size:0.9rem;
    transition:background .2s ease, transform .2s ease;
}
.delete-confirm:hover{
    background:#a93226;
    color:#fff;
    transform:translateY(-2px);
}
</style>
{% endblock %}
