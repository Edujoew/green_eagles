{% extends 'green_eagles/base.html' %}
{% block content %}
<div class="admin-form-wrap">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="admin-form-header">
                    <div class="admin-form-icon">
                        <i class="bi bi-pencil-square"></i>
                    </div>
                    <div>
                        <h4>Edit Member</h4>
                        <p>Updating account for <strong>{{ member.username }}</strong></p>
                    </div>
                </div>

                <form method="post" class="admin-form-card">
                    {% csrf_token %}

                    <div class="edit-section-head">
                        <span class="edit-num">1</span>
                        <div>
                            <h5>Account Info</h5>
                            <p>Username, email and login details</p>
                        </div>
                    </div>
                    {{ u_form.as_p }}

                    <div class="edit-section-head mt-4">
                        <span class="edit-num">2</span>
                        <div>
                            <h5>Profile Details</h5>
                            <p>Wing, role and patrol assignment</p>
                        </div>
                    </div>
                    {{ p_form.as_p }}

                    <div class="admin-form-actions">
                        <a href="{% url 'green_eagles:admin_manage_members' %}" class="admin-cancel">Cancel</a>
                        <button type="submit" class="admin-save">
                            <i class="bi bi-check2"></i> Update Member
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<style>
.admin-form-wrap{
    background:#f4f8f5;
    min-height:calc(100vh - 200px);
    padding:2.6rem 0 3rem;
}

.admin-form-header{
    display:flex;
    align-items:center;
    gap:1rem;
    margin-bottom:1.4rem;
}
.admin-form-icon{
    width:46px; height:46px;
    flex-shrink:0;
    border-radius:12px;
    background:linear-gradient(160deg,#14532d,#0c3a1f);
    color:#d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
}
.admin-form-header h4{
    font-weight:800;
    color:#14532d;
    margin-bottom:0.1rem;
    font-size:1.25rem;
}
.admin-form-header p{
    color:#6b7a70;
    font-size:0.85rem;
    margin-bottom:0;
}
.admin-form-header p strong{
    color:#14532d;
}

.admin-form-card{
    background:#fff;
    border-radius:16px;
    padding:2rem;
    box-shadow:0 10px 28px rgba(20,83,45,0.08);
    border-top:4px solid #14532d;
}

.edit-section-head{
    display:flex;
    align-items:flex-start;
    gap:0.9rem;
    margin-bottom:1.3rem;
    padding-bottom:1rem;
    border-bottom:1px solid #edf2ee;
}
.edit-num{
    width:30px; height:30px;
    flex-shrink:0;
    border-radius:50%;
    background:linear-gradient(160deg,#14532d,#0c3a1f);
    color:#d4af37;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.85rem;
}
.edit-section-head h5{
    font-weight:800;
    color:#14532d;
    margin-bottom:0.1rem;
    font-size:0.98rem;
}
.edit-section-head p{
    color:#9aa89f;
    font-size:0.8rem;
    margin-bottom:0;
}

.admin-form-card p{ margin-bottom:1.1rem; }
.admin-form-card label{
    display:block;
    font-weight:700;
    font-size:0.82rem;
    color:#14532d;
    margin-bottom:6px;
}
.admin-form-card input,
.admin-form-card select{
    width:100%;
    border:1.5px solid #e0e6e2;
    border-radius:9px;
    padding:11px 14px;
    font-size:0.94rem;
    transition:border-color .2s ease, box-shadow .2s ease;
}
.admin-form-card input:focus,
.admin-form-card select:focus{
    outline:none;
    border-color:#14532d;
    box-shadow:0 0 0 4px rgba(20,83,45,0.1);
}

.admin-form-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:1.4rem;
    padding-top:1.2rem;
    border-top:1px solid #edf2ee;
}
.admin-cancel{
    padding:0.65rem 1.4rem;
    border-radius:9px;
    border:1.5px solid #d8e3da;
    color:#5c6b63;
    font-weight:700;
    font-size:0.88rem;
    text-decoration:none;
    transition:background .2s ease;
}
.admin-cancel:hover{
    background:#f4f8f5;
    color:#14532d;
}
.admin-save{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#14532d;
    color:#fff;
    border:none;
    padding:0.65rem 1.6rem;
    border-radius:9px;
    font-weight:800;
    font-size:0.88rem;
    transition:background .2s ease, transform .2s ease;
}
.admin-save:hover{
    background:#0c3a1f;
    color:#fff;
    transform:translateY(-2px);
}
</style>
{% endblock %}
